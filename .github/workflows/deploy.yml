name: Deploy (terraform apply)

# Manual, approval-gated cloud deploy of the Pathways CRM API infra (dedicated
# RDS + ECR + one-off migrator). Runs `terraform plan` always; runs
# `terraform apply` only after the `production` environment's required reviewers
# approve. Uses GitHub OIDC — no long-lived AWS keys.
#
# Auth: both jobs assume the role in the repo secret AWS_ROLE_ARN (your existing
# deploy role). The stack does NOT create its own OIDC role by default
# (create_github_oidc_role=false), so nothing here needs to be bootstrapped.
#
# Prereqs:
#   - The S3/DynamoDB backend in environments/dev/backend.tf exists (shared
#     corvia-tfstate bucket + corvia-tf-locks table).
#   - repo secret AWS_ROLE_ARN (a role allowed to manage this stack:
#     RDS/EC2/SG/IAM/ECR/ECS + read the state bucket + lock table), repo var
#     AWS_REGION.
#   - GitHub Environment "production" with required reviewers configured.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag the migrator task runs (e.g. dev or a commit SHA)"
        required: true
        default: "dev"

permissions:
  id-token: write
  contents: read

env:
  TF_DIR: infra/terraform/environments/dev

jobs:
  plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          # Role trust allows only AssumeRoleWithWebIdentity (not TagSession),
          # so skip session tagging to avoid "Not authorized".
          role-skip-session-tagging: true
      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init
      - name: Terraform plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform plan -input=false \
            -var="image_tag=${{ inputs.image_tag }}" \
            -out=tfplan
      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_DIR }}/tfplan
          retention-days: 5

  apply:
    name: Terraform apply (approval required)
    needs: plan
    runs-on: ubuntu-latest
    # This is the gate: the "production" environment must have required reviewers.
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          # Role trust allows only AssumeRoleWithWebIdentity (not TagSession),
          # so skip session tagging to avoid "Not authorized".
          role-skip-session-tagging: true
      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init
      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_DIR }}
      - name: Terraform apply
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -input=false tfplan
      - name: Outputs
        working-directory: ${{ env.TF_DIR }}
        run: |
          {
            echo "### Deploy outputs"
            echo '```'
            terraform output
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
