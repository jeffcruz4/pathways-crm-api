name: Build and push image

# Builds the API/migrator image and pushes it to ECR using GitHub OIDC
# (no long-lived AWS keys). The same image runs the API and the one-off
# migrator task.
#
# Prerequisites (one-time, set in repo settings):
#   Secrets:  AWS_ROLE_ARN   -> terraform output gha_deploy_role_arn
#   Variables: AWS_REGION    -> e.g. us-east-1
#              ECR_REPOSITORY -> terraform output ecr_repository_url
#
# The OIDC role only trusts refs/heads/main (and the "production" environment),
# so this job runs on push to main. Images are tagged with the commit SHA and,
# on main, also "dev" (the tag the migrator task definition references).

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "drizzle/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "Dockerfile"
      - ".github/workflows/build-and-push.yml"
  workflow_dispatch: {}
  # Allow other workflows (e.g. migrate.yml) to reuse this build.
  workflow_call:
    outputs:
      image:
        description: "Full image reference that was pushed (repo:sha)."
        value: ${{ jobs.build.outputs.image }}

permissions:
  id-token: write # required for OIDC
  contents: read

concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image tags
        id: meta
        run: |
          set -euo pipefail
          REPO="${{ vars.ECR_REPOSITORY }}"
          SHA="${GITHUB_SHA::12}"
          echo "image=${REPO}:${SHA}" >> "$GITHUB_OUTPUT"
          echo "repo=${REPO}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Tag with the commit SHA and the "dev" tag the migrator task uses.
          tags: |
            ${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.repo }}:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "Pushed: ${{ steps.meta.outputs.image }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Also tagged: ${{ steps.meta.outputs.repo }}:dev" >> "$GITHUB_STEP_SUMMARY"
